# Snippet for Nginx in front of the commerce API.
# Include inside the shop.zero-trust-security.org server block (HTTPS).
# Caches anonymous public catalogue GETs; bypasses when Cookie/Authorization present.

proxy_cache_path /var/cache/nginx/commerce levels=1:2 keys_zone=commerce_api:32m
                 max_size=256m inactive=10m use_temp_path=off;

map $http_authorization $commerce_bypass_auth {
  default 0;
  "~.+" 1;
}

map $http_cookie $commerce_bypass_cookie {
  default 0;
  "~*(customer_session|admin_session|cart_token)" 1;
}

