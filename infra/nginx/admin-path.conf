# Mount HQ Admin at https://<shop-host>/admin → Next admin (compose binds 127.0.0.1:3101).
# Include inside the server { } that serves the storefront host.
# Requires ADMIN_BASE_PATH=/admin at admin image build time (see docker-compose.prod.yml).

location = /admin {
  return 301 /admin/;
}

location /admin/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass http://127.0.0.1:3101;
}

# Next.js assets when admin is built with basePath=/admin
location /admin/_next/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3101;
}
